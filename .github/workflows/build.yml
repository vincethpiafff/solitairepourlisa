name: Construire l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compiler
        run: gradle assembleRelease
      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk Solitaire.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Solitaire-APK
          path: Solitaire.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Solitaire (version ${{ github.run_number }})
          files: Solitaire.apk
